name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pi: [locked, latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: matrix.pi == 'latest'
        run: npm install --no-save @earendil-works/pi-coding-agent@latest
      - run: npm ls --depth=0 @earendil-works/pi-coding-agent @langfuse/otel @langfuse/tracing
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
